
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIS — Taller Nacional 2026</title>

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #ffffff;

    /* Nueva imagen integrada */
    background-image: url("https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/main/FONDO_TALLER_2026_1080x1920.jpg");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: 100% auto;
    background-color: #f8fbfd;
    background-attachment: scroll;

    min-height: 100vh;
}

/* Ya no se necesita una imagen superior independiente */
.title {
    display: none;
}

.banner {
    display: none;
}

/* Menú de navegación */
.menu {
    width: 90%;
    max-width: 450px;
    margin: 0 auto;

    /* Espacio para los logotipos y el título integrados
       en la nueva imagen */
    padding-top: clamp(390px, 48vw, 570px);

    display: flex;
    flex-direction: column;
    gap: 20px;
}

.item {
    width: 100%;
    min-height: 85px;

    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 16px;
    padding: 14px;

    display: flex;
    align-items: center;
    gap: 16px;

    box-shadow: 0 4px 12px rgba(25, 65, 120, 0.15);
    transition: transform 0.2s, background 0.2s;

    text-decoration: none;
    color: #244fa5;
    font-size: 18px;
    font-weight: bold;
    text-align: left;
}

.item:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.98);
}

.icon {
    width: 52px;
    height: 52px;
    object-fit: contain;
    flex-shrink: 0;
}

/* Pie de página: el mensaje ya está integrado en la imagen */
.footer {
    display: none;
}

/* Ajustes para celulares */
@media (max-width: 700px) {
    body {
        background-size: 100% auto;
        background-position: center top;
        background-attachment: scroll;
    }

    .menu {
        width: 88%;
        max-width: 450px;

        /* Posición aproximada del espacio blanco
           debajo del título de la imagen */
        padding-top: 102vw;

        gap: 14px;
    }

    .item {
        min-height: 72px;
        padding: 11px;
        gap: 12px;
        border-radius: 14px;
        font-size: 16px;
    }

    .icon {
        width: 45px;
        height: 45px;
    }
}

/* Pantallas muy pequeñas */
@media (max-width: 360px) {
    .menu {
        width: 92%;
    }

    .item {
        font-size: 14px;
        gap: 9px;
    }

    .icon {
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<div class="title">
    <img class="banner" src="" alt="">
</div>

<div class="menu">

    <a class="item"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdMMGge6g0n3dxDIEcjphWPQyumTHJqmsne83cC1X4XgBsJgg/viewform?usp=sharing&amp;ouid=109188244496116119373">
        <img class="icon"
             src="https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/b92c5345536ffadec848a9688e4ac21fa8d2f076/1%20Icono%20Formulario.png"
             alt="">
        <span>Formulario de Asistencia (Ingreso)</span>
    </a>

    <a class="item"
       href="https://docs.google.com/forms/d/e/1FAIpQLSeMnNWKhpUcaaq18iAzJ4CSl9V5YiCS7lfkEi4olRi6K7l-2A/viewform?usp=sharing&amp;ouid=109188244496116119373">
        <img class="icon"
             src="https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/b92c5345536ffadec848a9688e4ac21fa8d2f076/1%20Icono%20Formulario.png"
             alt="">
        <span>Formulario de Asistencia (Salida)</span>
    </a>

    <a class="item"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdzIZ0ZbVemf14JZe4xwuxzABtFEwjeg3foRFISVs0KitjhpQ/viewform?usp=sharing&amp;ouid=109188244496116119373">
        <img class="icon"
             src="https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/b92c5345536ffadec848a9688e4ac21fa8d2f076/2%20Icono%20Preguntas.png"
             alt="">
        <span>Preguntas Frecuentes</span>
    </a>

    <a class="item"
       href="https://drive.google.com/drive/folders/1-xHxKvsQifzkdtSLPjk1dIffa8gm9wap">
        <img class="icon"
             src="https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/b92c5345536ffadec848a9688e4ac21fa8d2f076/3%20Icono%20Repositorio.png"
             alt="">
        <span>Repositorio</span>
    </a>

    <a class="item"
       href="https://www.google.com/maps/d/u/0/edit?mid=1-wV4SA8ydbiOAT0pZ8R-VhJnTmYC2pc&amp;usp=sharing">
        <img class="icon"
             src="https://raw.githubusercontent.com/planga2025-droid/PLAN-UPPA-2025/b92c5345536ffadec848a9688e4ac21fa8d2f076/3%20Icono%20Repositorio.png"
             alt="">
        <span>Lugares de Interés</span>
    </a>

</div>

</body>
</html>
